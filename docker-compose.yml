version: '3.8'
services:
  db:
    # Use a version of postgres that includes pgvector or install it via a Dockerfile.
    # For this demonstration, we will use a pre-built image.
    image: pgvector/pgvector:pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dasaverse
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
